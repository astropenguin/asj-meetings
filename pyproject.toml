[project]
name = "asj-meetings"
version = "0.1.0"
description = "Unofficial database of the ASJ meetings"
readme = "README.md"
keywords = [
    "astronomy",
    "asj",
    "database",
    "meetings",
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "beautifulsoup4>=4,<5",
    "fire>=0.7,<1.0",
    "httpx>=0.28,<1.0",
    "langdetect>=1,<2",
    "nltk>=3,<4",
    "numpy>=2,<3",
    "pandas>=2,<3",
    "pandas-stubs>=2,<3",
    "platformdirs>=4,<5",
    "pylatexenc>=2,<3",
    "pymupdf>=1,<2",
    "sudachipy>=0.6,<1.0",
    "sudachidict-full>=20250825,<20260000",
    "tqdm>=4,<5",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[[project.authors]]
name = "Akio Taniguchi"
email = "taniguchi.akio@gmail.com"

[project.license]
file = "LICENSE"

[project.urls]
repository = "https://github.com/astropenguin/asj-meetings"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25,<26",
    "ipython>=8,<10",
    "pyright>=1,<2",
    "pytest>=8,<9",
]

[tool.pyright]
typeCheckingMode = "basic"
